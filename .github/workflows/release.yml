# Release pipeline (M5-03, docs/testing.md §13, docs/release.md): a version tag (`v1.2.3` or `1.2.3`) builds the desktop
# installers and erable-cli on the three systems, builds and scans the server image, then publishes. No tests run here: the
# tagged commit has already been through the PR pipeline. A tag pushed with Git gets a draft release, published once
# everything is green; a release created on GitHub (which pushes its tag) is kept as it is and receives the installers.
# Third-party actions are pinned by commit SHA (tag in comment); Renovate bumps them.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*", "[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z), or with « attach » the existing tag whose release receives the installers"
        required: true
      attach:
        description: "Build the tag and attach the installers to its existing release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NODE_VERSION: "22"
  # A tag push publishes; a manual run only builds, unless it attaches to the release of an existing tag.
  PUBLISH: ${{ github.event_name == 'push' || inputs.attach }}
  # The tag (or, for a build-only run, the version as typed); the version number is ${TAG#v}.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  # What is built: the tag itself when attaching to its release, the ref of the run otherwise.
  SOURCE_REF: ${{ inputs.attach && format('refs/tags/{0}', inputs.version) || github.ref }}

jobs:
  notes:
    name: Release notes and draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Notes from the commits since the previous tag
        run: node build/release-notes.mjs "$TAG" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
      # A release created on GitHub already exists: it is kept (published or not), and only gets the notes if it has none.
      - name: Draft release, or reuse the one created on GitHub
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            echo "The release $TAG exists: the installers will be attached to it."
            if [ -z "$body" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" --draft --verify-tag --title "Erable ${TAG#v}" --notes-file release-notes.md
          fi

  package:
    name: Installer (${{ matrix.rid }})
    needs: [notes]
    strategy:
      # Every system reports its own failure: one broken installer must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Signing is optional: without these secrets the packages are unsigned (docs/release.md lists what to provide).
    env:
      ERABLE_SIGN_AZURE_METADATA: ${{ secrets.ERABLE_SIGN_AZURE_METADATA }}
      ERABLE_SIGN_APPLE_APP_IDENTITY: ${{ secrets.ERABLE_SIGN_APPLE_APP_IDENTITY }}
      ERABLE_SIGN_APPLE_INSTALL_IDENTITY: ${{ secrets.ERABLE_SIGN_APPLE_INSTALL_IDENTITY }}
      ERABLE_NOTARY_PROFILE: ${{ secrets.ERABLE_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm -C src/web install --frozen-lockfile

      - name: Package (Velopack)
        shell: bash
        run: node build/pack-desktop.mjs ${{ matrix.rid }} --version "${TAG#v}"

      # erable-cli (docs/cli.md): one self-contained executable per system, next to the installers.
      - name: Command-line tool
        shell: bash
        run: node build/publish-cli.mjs ${{ matrix.rid }} --version "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/release/${{ matrix.rid }}/
            artifacts/cli/erable-cli-${{ matrix.rid }}.*
          retention-days: 30
      - name: Attach to the release (draft, or the one created on GitHub)
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/release/${{ matrix.rid }}/* artifacts/cli/erable-cli-${{ matrix.rid }}.* --clobber

  # The Android APK (M6-08, docs/release.md). Signed with the release keystore when its secrets exist; without them it is
  # only built (a debug key differs on every runner: such an APK could not be updated), and not attached.
  android:
    name: Android APK
    needs: [notes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AndroidSdkDirectory: /usr/local/lib/android/sdk
      ERABLE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ERABLE_ANDROID_KEYSTORE_BASE64 }}
      ERABLE_ANDROID_KEY_ALIAS: ${{ secrets.ERABLE_ANDROID_KEY_ALIAS }}
      ERABLE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ERABLE_ANDROID_KEYSTORE_PASSWORD }}
      ERABLE_ANDROID_KEY_PASSWORD: ${{ secrets.ERABLE_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Android workload
        run: dotnet workload install android
      - name: Android platform of the target API
        run: |
          echo "JavaSdkDirectory=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          JavaSdkDirectory="$JAVA_HOME_17_X64" dotnet build src/Erable.Android -t:InstallAndroidDependencies -p:AcceptAndroidSDKLicenses=true
      - name: Release keystore
        if: env.ERABLE_ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ERABLE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/erable.keystore"
          echo "ERABLE_ANDROID_KEYSTORE=$RUNNER_TEMP/erable.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        run: node build/publish-android.mjs --version "${TAG#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: artifacts/android/*.apk
          retention-days: 30
      - name: Attach to the release (signed only)
        if: env.PUBLISH == 'true' && env.ERABLE_ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/android/*.apk --clobber
      - name: No release keystore
        if: env.ERABLE_ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::ERABLE_ANDROID_KEYSTORE_BASE64 is not set: the APK is built but not attached (docs/release.md)."

  image:
    name: Server image (build, scan, push)
    needs: [notes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Build
        run: docker build --tag erable:release .
      - name: Scan for known vulnerabilities (fixed HIGH and CRITICAL fail the release)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: erable:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Push to the GitHub registry
        if: env.PUBLISH == 'true'
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/erable"
          echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for tag in "${TAG#v}" latest; do
            docker tag erable:release "$repository:$tag"
            docker push "$repository:$tag"
          done

  publish:
    name: Publish
    # Not the Android job: a release without keystore secrets still publishes its desktop installers.
    needs: [package, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No-op for a release already published on GitHub.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
