# PR pipeline (docs/testing.md §13): every branch push and pull request, target < 12 min.
# Tag pushes (releases) are left to release.yml: the tagged commit has already been through this pipeline.
# Third-party actions are pinned by commit SHA (tag in comment); Renovate will bump them (§13).
name: PR

on:
  push:
    # A branch filter alone excludes tags.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A push and its pull request share one group: the older run is cancelled.
  group: pr-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  NODE_VERSION: "22"

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  checks:
    name: Lint, contract, unit tests (Linux, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm -C src/web install --frozen-lockfile

      # C#: analyzers run in the build (warnings are errors); dotnet format checks .editorconfig style.
      - run: dotnet format Erable.sln --verify-no-changes
      - run: dotnet build Erable.sln
      - name: .NET tests (Debug, with /_test endpoints)
        run: dotnet test --solution Erable.sln --no-build --report-xunit-trx --results-directory TestResults/dotnet

      # TypeScript
      - run: pnpm -C src/web typecheck
      - run: pnpm -C src/web lint
      - run: pnpm -C src/web format:check
      - run: pnpm -C src/web test
      - name: API contract (OpenAPI document and generated client up to date)
        run: pnpm -C src/web api:check
      - name: Build and bundle size (budget 500 kB gzip)
        run: |
          pnpm -C src/web build
          pnpm -C src/web bundle-size
      - name: E2E traceability (all M0 scenarios must have a test)
        run: pnpm -C src/web e2e:trace --enforce M5

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-checks
          path: TestResults/
          if-no-files-found: ignore

  unit:
    name: Build and unit tests (${{ matrix.os }}, Release)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm -C src/web install --frozen-lockfile
      - name: .NET build and tests (Release, also proves /_test is absent)
        run: dotnet test --solution Erable.sln --configuration Release --report-xunit-trx --results-directory TestResults/dotnet
      - run: pnpm -C src/web test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: ignore

  e2e:
    name: E2E (Chromium + WebKit, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm -C src/web install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm -C src/web exec playwright install --with-deps chromium webkit
      - run: dotnet build src/Erable.Server
      - name: E2E (@pr)
        run: pnpm -C src/web e2e:pr
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            src/web/playwright-report/
            src/web/test-results/
          retention-days: 14

  desktop:
    name: Desktop artifact and smoke (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, smoke: cdp }
          - { os: ubuntu-latest, rid: linux-x64, smoke: self-test }
          - { os: macos-latest, rid: osx-arm64, smoke: self-test }
          # Intel Macs: published (cross-compiled on the arm64 runner) but not smoke-tested.
          - { os: macos-latest, rid: osx-x64, smoke: none }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # E2E-16-01 asks for 3 s; shared runners (software rendering, Xvfb, cold disks) get 10 s (docs/testing.md §10).
      ERABLE_STARTUP_BUDGET_MS: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: pnpm -C src/web install --frozen-lockfile

      - name: Publish (self-contained, SPA embedded) and archive
        run: node build/publish-desktop.mjs ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: erable-desktop-${{ matrix.rid }}
          path: artifacts/desktop/Erable-${{ matrix.rid }}.*
          retention-days: 14

      # Windows: Playwright attaches to WebView2 over CDP (E2E-16-01, E2E-16-02), then the self-test.
      - if: matrix.smoke == 'cdp'
        name: Smoke (CDP)
        run: pnpm -C src/web e2e:desktop
      - if: matrix.smoke == 'cdp'
        name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process artifacts/desktop/win-x64/Erable/Erable.Desktop.exe -ArgumentList '--self-test','--self-test-report','self-test.json' -PassThru -Wait
          Get-Content self-test.json
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Get-Process -Name Erable.Desktop -ErrorAction SilentlyContinue) { Write-Error 'Erable process still running'; exit 1 }

      # Linux: WebKitGTK 4.1 under a virtual display. Ubuntu 24.04 restricts the unprivileged user namespaces
      # that WebKit's bubblewrap sandbox needs; the runner relaxes it rather than disabling the sandbox.
      - if: matrix.smoke == 'self-test' && runner.os == 'Linux'
        name: Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libnotify4 xvfb gstreamer1.0-libav gstreamer1.0-plugins-good
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: matrix.smoke == 'self-test'
        name: Self-test (E2E-16-01, E2E-16-02)
        shell: bash
        run: |
          app=artifacts/desktop/${{ matrix.rid }}/Erable/Erable.Desktop
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; else run=""; fi
          status=0
          $run "$app" --self-test --self-test-report self-test.json || status=$?
          cat self-test.json || true
          if pgrep -f Erable.Desktop; then echo "Erable process still running"; exit 1; fi
          exit $status
      - if: ${{ failure() && matrix.smoke != 'none' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-${{ matrix.rid }}
          path: |
            self-test.json
            src/web/playwright-report-desktop/
            src/web/test-results/
          if-no-files-found: ignore
