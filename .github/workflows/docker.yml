# Server image: built, scanned for known vulnerabilities, started and checked.
# Third-party actions are pinned by commit SHA (tag in comment); Renovate will bump them.
name: Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - src/**
      - Directory.*.props
      - Directory.Packages.props
      - global.json
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - src/**
      - Directory.*.props
      - Directory.Packages.props
      - global.json
      - .github/workflows/docker.yml
  schedule:
    # New vulnerabilities appear in base images without any change of ours.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build, scan, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --tag erable:ci .

      - name: Scan for known vulnerabilities (fixed HIGH and CRITICAL fail the job)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: erable:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Start the container and wait for its health check
        run: |
          docker run --detach --name erable \
            --publish 8080:8080 \
            --env ERABLE_ADMIN_LOGIN=admin \
            --env ERABLE_ADMIN_PASSWORD=ci-password-2026 \
            erable:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' erable)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs erable
          exit 1

      - name: The client is served and the administrator can sign in
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/info
          curl --fail --silent --show-error --request POST http://127.0.0.1:8080/api/v1/auth/login \
            --header 'Content-Type: application/json' \
            --data '{"login":"admin","password":"ci-password-2026"}'
          # Not root.
          test "$(docker inspect --format '{{.Config.User}}' erable)" = 1654

      - name: The test endpoints are not there
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8080/_test/reset?slot=x)
          test "$code" = 404

      - if: ${{ failure() }}
        run: docker logs erable
