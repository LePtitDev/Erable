name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could Erable help? Mention the features (docs/features.md) it touches if you know them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
